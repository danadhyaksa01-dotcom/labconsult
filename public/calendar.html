<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jadwal Konsultasi - LABCONSULT</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <style>

    .calendar-page {
      min-height: calc(100vh - 73px);
      background: #f5f7fb;
      padding: 40px 0 80px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .calendar-header h1 {
      margin: 0 0 6px;
      font-size: 36px;
    }

    .calendar-header p {
      color: #687286;
      margin: 0;
    }

    .calendar-actions {
      display: flex;
      gap: 10px;
    }

    .calendar-card {
      background: #ffffff;
      border: 1px solid #e4e8ee;
      border-radius: 18px;
      overflow: hidden;
    }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 24px;
      border-bottom: 1px solid #edf0f4;
    }

    .calendar-toolbar h2 {
      margin: 0;
      font-size: 20px;
    }

    .week-navigation {
      display: flex;
      gap: 8px;
    }

    .calendar-btn {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;

      border: 1px solid #dce1e8;
      border-radius: 8px;

      background: #ffffff;

      cursor: pointer;

      font-weight: 700;
    }

    .calendar-btn:hover {
      background: #f5f7fb;
    }

    .calendar-wrapper {
      overflow-x: auto;
    }

    .calendar-grid {
      min-width: 900px;

      display: grid;

      grid-template-columns:
        70px
        repeat(7, minmax(110px, 1fr));
    }

    .calendar-day {
      min-height: 72px;

      padding: 14px 8px;

      text-align: center;

      border-right:
        1px solid #edf0f4;

      border-bottom:
        1px solid #edf0f4;
    }

    .day-name {
      margin-bottom: 4px;

      color: #687286;

      font-size: 12px;
      font-weight: 700;

      text-transform: uppercase;
    }

    .day-date {
      font-size: 20px;
      font-weight: 800;
    }

    .today {
      background: #f5f7fb;
    }

    .today .day-date {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #172033;
      color: #ffffff;
    }

    .time-label {
      min-height: 80px;

      padding: 10px;

      color: #687286;

      font-size: 12px;

      text-align: right;

      border-right:
        1px solid #edf0f4;

      border-bottom:
        1px solid #edf0f4;
    }

    .calendar-slot {
      position: relative;

      min-height: 80px;

      padding: 6px;

      border-right:
        1px solid #edf0f4;

      border-bottom:
        1px solid #edf0f4;

      background: #ffffff;
    }

    .consultation-event {
      min-height: 68px;

      padding: 9px 10px;

      border-radius: 9px;

      background: #172033;

      color: #ffffff;

      cursor: pointer;

      overflow: hidden;

      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .consultation-event:hover {
      opacity: 0.9;
    }

    .consultation-event.completed {
      background: #6b7280;
    }

    .event-time {
      margin-bottom: 3px;

      font-size: 11px;
      font-weight: 700;

      opacity: 0.8;
    }

    .event-title {
      margin-bottom: 4px;

      font-size: 12px;
      font-weight: 700;

      line-height: 1.35;
    }

    .event-topic {
      font-size: 11px;

      line-height: 1.3;

      opacity: 0.85;
    }

    .event-assistant {
      margin-top: 3px;

      font-size: 10px;

      line-height: 1.3;

      opacity: 0.75;
    }

    .calendar-legend {
      display: flex;

      gap: 20px;

      flex-wrap: wrap;

      padding: 20px 24px;

      border-top:
        1px solid #edf0f4;
    }

    .legend-item {
      display: flex;

      align-items: center;

      gap: 8px;

      color: #687286;

      font-size: 13px;
    }

    .legend-box {
      width: 12px;
      height: 12px;

      border-radius: 3px;

      background: #172033;
    }

    .legend-box.completed {
      background: #6b7280;
    }

    .upcoming-section {
      margin-top: 30px;
    }

    .upcoming-card {
      padding: 28px;

      background: #ffffff;

      border:
        1px solid #e4e8ee;

      border-radius: 18px;
    }

    .upcoming-card h2 {
      margin:
        0 0 20px;

      font-size: 22px;
    }

    .schedule-item {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 20px;

      padding: 18px 0;

      border-bottom:
        1px solid #edf0f4;

      cursor: pointer;
    }

    .schedule-item:first-of-type {
      padding-top: 0;
    }

    .schedule-item:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .schedule-title {
      margin: 0 0 5px;

      font-size: 16px;
      font-weight: 700;
    }

    .schedule-info {
      margin: 3px 0;

      color: #687286;

      font-size: 13px;

      line-height: 1.5;
    }

    .schedule-status {
      flex-shrink: 0;

      padding: 6px 11px;

      border-radius: 20px;

      background: #e8f5ec;

      color: #177245;

      font-size: 12px;
      font-weight: 700;
    }

    .schedule-status.completed {
      background: #eef0f3;
      color: #5f6874;
    }

    .loading {
      padding: 50px 20px;

      text-align: center;

      color: #687286;
    }

    .error-box {
      display: none;

      margin-bottom: 20px;

      padding: 15px 18px;

      border:
        1px solid #efcaca;

      border-radius: 10px;

      background: #fff5f5;

      color: #b42318;

      font-size: 14px;
    }

    @media (max-width: 700px) {

      .calendar-header {
        align-items: flex-start;

        flex-direction: column;
      }

      .calendar-toolbar {
        align-items: flex-start;

        flex-direction: column;
      }

      .schedule-item {
        align-items: flex-start;

        flex-direction: column;
      }

    }

  </style>

</head>

  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    // =========================================================
    // SEMENTARA
    // Nanti diganti otomatis dari login/session.
    // =========================================================

    const PRAKTIKAN_ID = 3;


    // =========================================================
    // STATE
    // =========================================================

    let consultations = [];

    let currentWeekStart =
      getMonday(
        new Date()
      );


    // =========================================================
    // ELEMENT
    // =========================================================

    const weekTitle =
      document.getElementById(
        "week-title"
      );


    const calendarGrid =
      document.getElementById(
        "calendar-grid"
      );


    const upcomingCard =
      document.getElementById(
        "upcoming-card"
      );


    const errorBox =
      document.getElementById(
        "error-box"
      );


    // =========================================================
    // DATE HELPERS
    // =========================================================

    const DAY_NAMES = [
      "Sen",
      "Sel",
      "Rab",
      "Kam",
      "Jum",
      "Sab",
      "Min"
    ];


    const MONTH_NAMES = [
      "Januari",
      "Februari",
      "Maret",
      "April",
      "Mei",
      "Juni",
      "Juli",
      "Agustus",
      "September",
      "Oktober",
      "November",
      "Desember"
    ];


    function cloneDate(date) {

      return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );

    }


    function getMonday(date) {

      const result =
        cloneDate(
          date
        );


      const day =
        result.getDay();


      const diff =
        day === 0
          ? -6
          : 1 - day;


      result.setDate(
        result.getDate() + diff
      );


      return result;

    }


    function addDays(
      date,
      amount
    ) {

      const result =
        cloneDate(
          date
        );


      result.setDate(
        result.getDate() + amount
      );


      return result;

    }


    function dateToKey(
      date
    ) {

      return (
        `${date.getFullYear()}-` +

        `${String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        )}-` +

        `${String(
          date.getDate()
        ).padStart(
          2,
          "0"
        )}`
      );

    }


    function parseDateOnly(
      value
    ) {

      if (!value) {

        return null;

      }


      const raw =
        String(
          value
        ).slice(
          0,
          10
        );


      const parts =
        raw
          .split("-")
          .map(Number);


      if (
        parts.length !== 3 ||
        parts.some(
          Number.isNaN
        )
      ) {

        return null;

      }


      return new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
      );

    }


    function formatLongDate(
      value
    ) {

      const date =
        parseDateOnly(
          value
        );


      if (!date) {

        return "-";

      }


      return date.toLocaleDateString(
        "id-ID",
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

    }


    function formatTime(
      value
    ) {

      if (!value) {

        return "-";

      }


      return String(
        value
      ).slice(
        0,
        5
      );

    }


    function parseTimeToMinutes(
      value
    ) {

      if (!value) {

        return 0;

      }


      const parts =
        String(
          value
        )
          .slice(
            0,
            5
          )
          .split(":")
          .map(Number);


      if (
        parts.length !== 2 ||
        parts.some(
          Number.isNaN
        )
      ) {

        return 0;

      }


      return (
        parts[0] * 60 +
        parts[1]
      );

    }


    function formatWeekRange(
      start
    ) {

      const end =
        addDays(
          start,
          6
        );


      if (
        start.getMonth() ===
        end.getMonth() &&
        start.getFullYear() ===
        end.getFullYear()
      ) {

        return (
          `${start.getDate()}–` +
          `${end.getDate()} ` +
          `${MONTH_NAMES[start.getMonth()]} ` +
          `${start.getFullYear()}`
        );

      }


      if (
        start.getFullYear() ===
        end.getFullYear()
      ) {

        return (
          `${start.getDate()} ` +
          `${MONTH_NAMES[start.getMonth()]} ` +
          `– ` +
          `${end.getDate()} ` +
          `${MONTH_NAMES[end.getMonth()]} ` +
          `${end.getFullYear()}`
        );

      }


      return (
        `${start.getDate()} ` +
        `${MONTH_NAMES[start.getMonth()]} ` +
        `${start.getFullYear()} ` +
        `– ` +
        `${end.getDate()} ` +
        `${MONTH_NAMES[end.getMonth()]} ` +
        `${end.getFullYear()}`
      );

    }


    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    // =========================================================
    // LOAD DATA
    // =========================================================

    async function loadConsultations() {

      try {

        errorBox.style.display =
          "none";


        const response =
          await fetch(
            "/consultations"
          );


        if (!response.ok) {

          throw new Error(
            "Gagal mengambil data konsultasi."
          );

        }


        const data =
          await response.json();


        // Backend mengembalikan:
        //
        // {
        //   success: true,
        //   consultations: [...]
        // }

        const list =
          Array.isArray(
            data.consultations
          )
            ? data.consultations
            : [];


        consultations =
          list.filter(
            item => {

              return (

                Number(
                  item.praktikan_id
                ) ===
                PRAKTIKAN_ID

                &&

                (
                  item.status ===
                    "approved"

                  ||

                  item.status ===
                    "completed"
                )

              );

            }
          );


        // Urutkan berdasarkan tanggal + jam

        consultations.sort(
          (
            a,
            b
          ) => {

            const aKey =
              `${a.consultation_date} ${a.start_time}`;


            const bKey =
              `${b.consultation_date} ${b.start_time}`;


            return aKey.localeCompare(
              bKey
            );

          }
        );


        console.log(
          "Data calendar:",
          consultations
        );


        // =====================================================
        // CARI JADWAL TERDEKAT
        // =====================================================

        const todayKey =
          dateToKey(
            new Date()
          );


        const nearest =
          consultations.find(
            item => {

              return (
                String(
                  item.consultation_date
                ).slice(
                  0,
                  10
                ) >=
                todayKey
              );

            }
          );


        if (nearest) {

          const nearestDate =
            parseDateOnly(
              nearest.consultation_date
            );


          if (nearestDate) {

            currentWeekStart =
              getMonday(
                nearestDate
              );

          }

        }


        renderCalendar();

        renderUpcoming();

      } catch (error) {

        console.error(
          error
        );


        errorBox.textContent =
          "Gagal mengambil data jadwal dari server.";


        errorBox.style.display =
          "block";


        consultations = [];


        renderCalendar();

        renderUpcoming();

      }

    }


    // =========================================================
    // DATA PER HARI
    // =========================================================

    function getForDate(
      dateKey
    ) {

      return consultations.filter(
        item => {

          return (
            String(
              item.consultation_date
            ).slice(
              0,
              10
            ) ===
            dateKey
          );

        }
      );

    }


    // =========================================================
    // RENDER CALENDAR
    // =========================================================

    function renderCalendar() {

      weekTitle.textContent =
        formatWeekRange(
          currentWeekStart
        );


      calendarGrid.innerHTML =
        "";


      // -------------------------------------------------------
      // HEADER WAKTU
      // -------------------------------------------------------

      const timeHeader =
        document.createElement(
          "div"
        );


      timeHeader.className =
        "calendar-day";


      timeHeader.innerHTML = `
        <div class="day-name">
          Waktu
        </div>
      `;


      calendarGrid.appendChild(
        timeHeader
      );


      // -------------------------------------------------------
      // HEADER 7 HARI
      // -------------------------------------------------------

      const dates = [];


      for (
        let i = 0;
        i < 7;
        i++
      ) {

        const date =
          addDays(
            currentWeekStart,
            i
          );


        dates.push(
          date
        );


        const header =
          document.createElement(
            "div"
          );


        header.className =
          "calendar-day";


        const now =
          new Date();


        if (
          dateToKey(
            date
          ) ===
          dateToKey(
            now
          )
        ) {

          header.classList.add(
            "today"
          );

        }


        header.innerHTML = `

          <div class="day-name">

            ${DAY_NAMES[i]}

          </div>


          <div class="day-date">

            ${date.getDate()}

          </div>

        `;


        calendarGrid.appendChild(
          header
        );

      }


      // -------------------------------------------------------
      // JAM 00:00 - 23:00
      // -------------------------------------------------------

      for (
        let hour = 0;
        hour <= 23;
        hour++
      ) {

        const label =
          document.createElement(
            "div"
          );


        label.className =
          "time-label";


        label.textContent =
          `${String(
            hour
          ).padStart(
            2,
            "0"
          )}:00`;


        calendarGrid.appendChild(
          label
        );


        for (
          let dayIndex = 0;
          dayIndex < 7;
          dayIndex++
        ) {

          const slot =
            document.createElement(
              "div"
            );


          slot.className =
            "calendar-slot";


          const date =
            dates[
              dayIndex
            ];


          const dateKey =
            dateToKey(
              date
            );


          const events =
            getForDate(
              dateKey
            ).filter(
              item => {

                const start =
                  parseTimeToMinutes(
                    item.start_time
                  );


                const end =
                  parseTimeToMinutes(
                    item.end_time
                  );


                const hourStart =
                  hour * 60;


                const hourEnd =
                  (hour + 1) * 60;


                return (
                  start < hourEnd &&
                  end > hourStart
                );

              }
            );


          events.forEach(
            item => {

              const event =
                document.createElement(
                  "div"
                );


              event.className =
                "consultation-event";


              if (
                item.status ===
                "completed"
              ) {

                event.classList.add(
                  "completed"
                );

              }


              event.innerHTML = `

                <div class="event-time">

                  ${escapeHtml(
                    formatTime(
                      item.start_time
                    )
                  )}

                  –

                  ${escapeHtml(
                    formatTime(
                      item.end_time
                    )
                  )}

                </div>


                <div class="event-title">

                  ${escapeHtml(
                    item.practical_name ||
                    "-"
                  )}

                </div>


                <div class="event-topic">

                  ${escapeHtml(
                    item.topic ||
                    "-"
                  )}

                </div>


                <div class="event-assistant">

                  Asisten:
                  ${escapeHtml(
                    item.assistant_name ||
                    "-"
                  )}

                </div>

              `;


              event.addEventListener(
                "click",
                () => {

                  alert(

                    "Detail Konsultasi\n\n" +

                    "Praktikum: " +
                    (
                      item.practical_name ||
                      "-"
                    ) +

                    "\nBAB: " +
                    (
                      item.chapter_name ||
                      "-"
                    ) +

                    "\nTopik: " +
                    (
                      item.topic ||
                      "-"
                    ) +

                    "\nAsisten: " +
                    (
                      item.assistant_name ||
                      "-"
                    ) +

                    "\nTanggal: " +
                    formatLongDate(
                      item.consultation_date
                    ) +

                    "\nWaktu: " +
                    formatTime(
                      item.start_time
                    ) +
                    " - " +
                    formatTime(
                      item.end_time
                    ) +

                    "\nStatus: " +
                    (
                      item.status ===
                      "completed"
                        ? "Selesai"
                        : "Disetujui"
                    )

                  );

                }
              );


              slot.appendChild(
                event
              );

            }
          );


          calendarGrid.appendChild(
            slot
          );

        }

      }

    }


    // =========================================================
    // UPCOMING
    // =========================================================

    function renderUpcoming() {

      if (!upcomingCard) {

        return;

      }


      upcomingCard.innerHTML = `

        <h2>
          Konsultasi Mendatang
        </h2>

      `;


      const todayKey =
        dateToKey(
          new Date()
        );


      const upcoming =
        consultations.filter(
          item => {

            return (

              item.status ===
              "approved"

              &&

              String(
                item.consultation_date
              ).slice(
                0,
                10
              ) >=
              todayKey

            );

          }
        );


      if (
        upcoming.length ===
        0
      ) {

        const empty =
          document.createElement(
            "p"
          );


        empty.className =
          "schedule-info";


        empty.textContent =
          "Belum ada konsultasi mendatang yang disetujui.";


        upcomingCard.appendChild(
          empty
        );


        return;

      }


      upcoming
        .slice(
          0,
          10
        )
        .forEach(
          item => {

            const schedule =
              document.createElement(
                "div"
              );


            schedule.className =
              "schedule-item";


            const practicalName =
              item.practical_name ||
              "-";


            const chapterName =
              item.chapter_name ||
              "-";


            const topic =
              item.topic ||
              practicalName;


            const assistant =
              item.assistant_name ||
              "-";


            schedule.innerHTML = `

              <div>

                <p class="schedule-title">

                  ${escapeHtml(
                    topic
                  )}

                </p>


                <p class="schedule-info">

                  ${escapeHtml(
                    practicalName
                  )}

                  •
                  
                  ${escapeHtml(
                    chapterName
                  )}

                </p>


                <p class="schedule-info">

                  ${escapeHtml(
                    formatLongDate(
                      item.consultation_date
                    )
                  )}

                  •

                  ${escapeHtml(
                    formatTime(
                      item.start_time
                    )
                  )}

                  –

                  ${escapeHtml(
                    formatTime(
                      item.end_time
                    )
                  )}

                </p>


                <p class="schedule-info">

                  Asisten:
                  ${escapeHtml(
                    assistant
                  )}

                </p>

              </div>


              <span class="schedule-status">

                Disetujui

              </span>

            `;


            upcomingCard.appendChild(
              schedule
            );

          }
        );

    }


    // =========================================================
    // NAVIGASI MINGGU
    // =========================================================

    const previousWeek =
      document.getElementById(
        "previous-week"
      );


    const nextWeek =
      document.getElementById(
        "next-week"
      );


    const todayButton =
      document.getElementById(
        "today-button"
      );


    if (previousWeek) {

      previousWeek.addEventListener(
        "click",
        () => {

          currentWeekStart =
            addDays(
              currentWeekStart,
              -7
            );


          renderCalendar();

        }
      );

    }


    if (nextWeek) {

      nextWeek.addEventListener(
        "click",
        () => {

          currentWeekStart =
            addDays(
              currentWeekStart,
              7
            );


          renderCalendar();

        }
      );

    }


    if (todayButton) {

      todayButton.addEventListener(
        "click",
        () => {

          currentWeekStart =
            getMonday(
              new Date()
            );


          renderCalendar();

        }
      );

    }


    // =========================================================
    // START
    // =========================================================

    loadConsultations();

  </script>


</body>

</html>
