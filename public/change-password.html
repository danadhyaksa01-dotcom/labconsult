<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ganti Password - LABCONSULT</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <style>

    .password-page {
      min-height: calc(100vh - 72px);
      padding: 60px 0 80px;
      background: #f5f7fb;
    }

    .password-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .password-header {
      margin-bottom: 28px;
    }

    .password-header h1 {
      margin-bottom: 10px;
      font-size: 36px;
    }

    .password-header p {
      color: #687286;
      line-height: 1.6;
    }

    .password-card {
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e4e8ee;
      border-radius: 16px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #dce1e8;
      border-radius: 9px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      box-sizing: border-box;
    }

    .form-group input:focus {
      border-color: #172033;
    }

    .password-help {
      margin-top: -8px;
      margin-bottom: 22px;
      color: #8790a0;
      font-size: 12px;
      line-height: 1.5;
    }

    .password-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .password-actions .btn {
      min-height: 44px;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      color: #237a42;
    }

    .message.error {
      color: #a83a3a;
    }

    .message.info {
      color: #3159a6;
    }

    @media (max-width: 600px) {

      .password-page {
        padding-top: 40px;
      }

      .password-header h1 {
        font-size: 30px;
      }

      .password-card {
        padding: 22px;
      }

      .password-actions {
        flex-direction: column;
      }

      .password-actions .btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <header class="navbar">

    <div class="container navbar-content">

      <a
        href="/"
        class="logo"
        id="logo-link"
      >
        LABCONSULT
      </a>

      <nav class="nav-menu">

        <a
          href="/"
          id="back-link"
        >
          Dashboard
        </a>

        <a
          href="/"
          id="logout-link"
        >
          Logout
        </a>

      </nav>

    </div>

  </header>


  <main class="password-page">

    <div class="container">

      <div class="password-wrap">


        <div class="password-header">

          <p class="eyebrow">
            KEAMANAN AKUN
          </p>

          <h1>
            Ganti Password
          </h1>

          <p id="user-info">
            Memuat informasi akun...
          </p>

        </div>


        <div class="password-card">

          <form id="password-form">


            <div class="form-group">

              <label for="current-password">
                Password Lama
              </label>

              <input
                type="password"
                id="current-password"
                name="current_password"
                autocomplete="current-password"
                required
              >

            </div>


            <div class="form-group">

              <label for="new-password">
                Password Baru
              </label>

              <input
                type="password"
                id="new-password"
                name="new_password"
                minlength="8"
                autocomplete="new-password"
                required
              >

            </div>


            <div class="password-help">
              Password baru minimal 8 karakter.
            </div>


            <div class="form-group">

              <label for="confirm-password">
                Konfirmasi Password Baru
              </label>

              <input
                type="password"
                id="confirm-password"
                name="confirm_password"
                minlength="8"
                autocomplete="new-password"
                required
              >

            </div>


            <div class="password-actions">

              <button
                type="submit"
                class="btn btn-primary"
                id="submit-button"
              >
                Simpan Password
              </button>

              <a
                href="/"
                class="btn btn-secondary"
                id="cancel-link"
              >
                Batal
              </a>

            </div>


            <p
              class="message"
              id="message"
            ></p>


          </form>

        </div>

      </div>

    </div>

  </main>


  <footer class="footer">

    <div class="container">

      <p>
        © 2026 LABCONSULT
      </p>

    </div>

  </footer>


  <script>

    let currentUser = null;


    const userInfo =
      document.getElementById(
        "user-info"
      );

    const backLink =
      document.getElementById(
        "back-link"
      );

    const cancelLink =
      document.getElementById(
        "cancel-link"
      );

    const logoutLink =
      document.getElementById(
        "logout-link"
      );

    const form =
      document.getElementById(
        "password-form"
      );

    const currentPasswordInput =
      document.getElementById(
        "current-password"
      );

    const newPasswordInput =
      document.getElementById(
        "new-password"
      );

    const confirmPasswordInput =
      document.getElementById(
        "confirm-password"
      );

    const submitButton =
      document.getElementById(
        "submit-button"
      );

    const message =
      document.getElementById(
        "message"
      );


    function parseJsonResponse(
      response
    ) {

      return response
        .json()
        .catch(
          () => ({})
        );

    }


    function setMessage(
      text,
      type
    ) {

      message.className =
        `message ${type || ""}`;

      message.textContent =
        text;

    }


    function getDashboardUrl(
      role
    ) {

      if (
        role ===
        "praktikan"
      ) {

        return "/dashboard.html";

      }

      if (
        role ===
        "asisten"
      ) {

        return "/asisten.html";

      }

      if (
        role ===
        "admin"
      ) {

        return "/admin.html";

      }

      return "/";

    }


    async function loadUser() {

      const response =
        await fetch(
          "/me",
          {
            method: "GET",
            credentials: "include"
          }
        );


      const data =
        await parseJsonResponse(
          response
        );


      if (
        response.status === 401 ||
        !data.authenticated ||
        !data.user
      ) {

        window.location.href =
          "/#login";

        return false;

      }


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.message ||
          "Gagal membaca session."
        );

      }


      currentUser =
        data.user;


      const dashboardUrl =
        getDashboardUrl(
          currentUser.role
        );


      backLink.href =
        dashboardUrl;

      cancelLink.href =
        dashboardUrl;


      userInfo.textContent =
        `${currentUser.name} · ${currentUser.nim}`;


      return true;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const currentPassword =
          currentPasswordInput.value;

        const newPassword =
          newPasswordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        if (
          newPassword.length < 8
        ) {

          setMessage(
            "Password baru minimal 8 karakter.",
            "error"
          );

          return;

        }


        if (
          newPassword !==
          confirmPassword
        ) {

          setMessage(
            "Konfirmasi password tidak sama.",
            "error"
          );

          return;

        }


        submitButton.disabled =
          true;

        setMessage(
          "Menyimpan password...",
          "info"
        );


        try {

          const response =
            await fetch(
              "/change-password",
              {

                method:
                  "PUT",

                headers: {

                  "Content-Type":
                    "application/json"

                },

                credentials:
                  "include",

                body:
                  JSON.stringify({

                    current_password:
                      currentPassword,

                    new_password:
                      newPassword,

                    confirm_password:
                      confirmPassword

                  })

              }
            );


          const data =
            await parseJsonResponse(
              response
            );


          if (
            !response.ok ||
            !data.success
          ) {

            throw new Error(
              data.message ||
              "Gagal mengubah password."
            );

          }


          form.reset();


          setMessage(
            "Password berhasil diubah.",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                getDashboardUrl(
                  currentUser.role
                );

            },
            1200
          );


        } catch (error) {

          console.error(
            "CHANGE PASSWORD ERROR:",
            error
          );


          setMessage(
            error.message ||
            "Gagal mengubah password.",
            "error"
          );

          submitButton.disabled =
            false;

        }

      }
    );


    logoutLink.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();


        try {

          await fetch(
            "/logout",
            {
              method:
                "POST",

              credentials:
                "include"
            }
          );

        } catch (error) {

          console.error(
            "LOGOUT ERROR:",
            error
          );

        }


        window.location.href =
          "/#login";

      }
    );


    async function initialize() {

      try {

        await loadUser();

      } catch (error) {

        console.error(
          "INITIALIZE ERROR:",
          error
        );

        setMessage(
          error.message ||
          "Gagal memuat halaman.",
          "error"
        );

      }

    }


    initialize();

  </script>


</body>

</html>
